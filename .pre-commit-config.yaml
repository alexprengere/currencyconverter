repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: "9026c9127e153371d7a78dfcb0c45ae2046a3d10"  # frozen: v0.17.6
    hooks:
      - id: "ruff"
        args: ["--fix"]

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "a5439e9af2ff9371297bb1a76a01b8ad17989b88"  # frozen: 26.10.1
    hooks:
      - id: "black"
        language_version: "python3.11"

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: "06a39750ec31860bb44f2acf67182c40016cd1e7"  # frozen: v1.32.0
    hooks:
      - id: "zizmor"
        args: ["--pedantic", "--no-progress"]
